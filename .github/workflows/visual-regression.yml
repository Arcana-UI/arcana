name: Visual Regression

# Visual snapshots are flake-prone (font rendering, in-flight animations,
# anti-aliasing differences across runners) and have been treated as
# advisory rather than required. Running them on every PR pollutes the
# status check list with red, so the suite has been moved out of the
# main CI workflow. It still runs:
#   - on demand from the Actions tab (workflow_dispatch)
#   - nightly at 06:00 UTC on develop, so baseline drift surfaces on
#     a predictable cadence instead of inside a release PR
#
# When the suite gets stabilized (animation-delay: -999s in the
# Playwright harness so reveal animations settle before capture, font
# bundling so runner-vs-local fonts match), it can be promoted back
# into ci.yml.

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC daily — late evening Pacific, off-hours for most contributors
    - cron: '0 6 * * *'

jobs:
  visual-test:
    name: Visual Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: pnpm build
      - run: pnpm test:visual

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-diffs
          path: test-results/
          retention-days: 7
