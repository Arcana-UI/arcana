name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run tests before publish
        # Last safety net — if tests fail, abort before publishing.
        run: pnpm test

      - name: Verify build output
        run: pnpm verify-build

      # Each publish step skips if the package's local version is already on npm.
      # This makes hotfix releases (where only one package version bumps) clean:
      # the unchanged packages no-op instead of failing the workflow. Real
      # publish failures (auth, network, npm errors) still surface loudly because
      # we only short-circuit on the explicit "already published" condition.
      - name: Publish @arcana-ui/tokens
        run: |
          cd packages/tokens
          VERSION=$(npm pkg get version | tr -d '"')
          if npm view "@arcana-ui/tokens@$VERSION" version >/dev/null 2>&1; then
            echo "@arcana-ui/tokens@$VERSION already on npm, skipping."
          else
            echo "Publishing @arcana-ui/tokens@$VERSION"
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @arcana-ui/core
        run: |
          cd packages/core
          VERSION=$(npm pkg get version | tr -d '"')
          if npm view "@arcana-ui/core@$VERSION" version >/dev/null 2>&1; then
            echo "@arcana-ui/core@$VERSION already on npm, skipping."
          else
            echo "Publishing @arcana-ui/core@$VERSION"
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @arcana-ui/cli
        run: |
          cd packages/cli
          VERSION=$(npm pkg get version | tr -d '"')
          if npm view "@arcana-ui/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@arcana-ui/cli@$VERSION already on npm, skipping."
          else
            echo "Publishing @arcana-ui/cli@$VERSION"
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @arcana-ui/mcp
        run: |
          cd packages/mcp
          VERSION=$(npm pkg get version | tr -d '"')
          if npm view "@arcana-ui/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@arcana-ui/mcp@$VERSION already on npm, skipping."
          else
            echo "Publishing @arcana-ui/mcp@$VERSION"
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
